<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安卓设备矩阵 · 设计调研原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e3e5e9;color:#252a34;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d8dde5;border-radius:5px;background:#fff;color:inherit;height:30px;padding:0 10px;white-space:nowrap}button:hover{background:#e9edf4}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5265d8;outline-offset:2px}button:disabled{color:#949ba7;cursor:default}button.plain{background:transparent;border-color:transparent}button.active{color:#4455bd;background:#e9edff;border-color:#ced5f6}.primary{background:#5265d8;color:#fff;border-color:#5265d8}.primary:hover{background:#4455bd}.review{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#252a34;color:#fff}.review strong{font-weight:600}.review span{color:#bec4ce}.review select{height:30px;background:#3a414d;color:#fff;border:1px solid #535b6a;border-radius:5px;padding:0 8px}.review .spacer{flex:1}.window{background:#eceef1;height:820px;min-height:640px;display:flex;flex-direction:column;width:100%;transition:width .15s;margin:0 auto;border-bottom:1px solid #cdd2db}.window.normal{max-width:1280px}.window:not(.normal){height:calc(100vh - 58px)}.titlebar,.toolbar,.statusbar,.log{flex-shrink:0}.titlebar{height:32px;background:#f3f4f6;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #d8dde5}.dot{width:10px;height:10px;border-radius:50%;background:#f46a60}.dot.yellow{background:#f0bf4f}.dot.green{background:#64bd59}.titlebar span:last-child{margin:auto;color:#626b7a;font-size:12px;padding-right:45px}.toolbar{position:relative;min-height:48px;display:flex;align-items:center;gap:6px;padding:8px 16px;background:#f7f8fa;border-bottom:1px solid #d8dde5}.nav{display:flex;gap:2px;margin-right:10px}.toolbar .search{margin-left:auto;display:flex;align-items:center;background:#fff;border:1px solid #d8dde5;border-radius:5px;padding-left:9px;gap:7px;color:#626b7a}.search input{border:0;background:transparent;height:28px;width:160px;color:#252a34;outline:none}.divider{height:20px;width:1px;background:#d8dde5;margin:0 6px}.content{display:flex;flex:1;min-height:0}.workspace{flex:1;min-width:0;padding:16px;overflow:auto}.viewline{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:#626b7a;font-size:12px}.viewline strong{color:#252a34;font-size:13px;font-weight:600}.viewline .spacer{flex:1}.viewline select{height:28px;border:1px solid #d8dde5;background:#f7f8fa;border-radius:4px;color:#626b7a;padding:0 6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,252px);gap:16px;align-content:start}.device{width:252px;background:#fff;border:1px solid #d8dde5;border-radius:6px;overflow:hidden}.device.target{border-color:#d8dde5}.device.chosen{background:#e9edff;border-color:#5265d8}.targettag{color:#4455bd}.empty{color:#626b7a;padding:24px 0}.device header{display:flex;gap:8px;align-items:center;height:42px;padding:0 12px}.device header strong{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.device header button{padding:0 6px}.device header input{accent-color:#5265d8;margin:0}.device .meta{padding:0 12px 10px;font-size:12px;color:#626b7a;display:flex;gap:8px}.status{color:#278361}.screen{height:410px;background:#171a20;display:flex;justify-content:center;margin:0 12px;border-radius:2px;overflow:hidden}.phone{height:100%;aspect-ratio:9/20;background:linear-gradient(145deg,#bac5dc,#e8eaf3 55%,#d8c5dc);padding:12px;color:#292e40;display:flex;flex-direction:column}.phonebar{font-size:10px;display:flex;justify-content:space-between}.clock{font-size:32px;font-weight:300;margin-top:45px;letter-spacing:-1px}.date{font-size:10px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px;margin-top:auto;padding-bottom:30px}.apps div{text-align:center;font-size:9px}.apps i{display:block;width:27px;height:27px;margin:0 auto 5px;border-radius:9px;background:#fff;color:#59647d;font-style:normal;font-size:14px;line-height:27px}.phone.samsung{background:linear-gradient(145deg,#b6d4d2,#e5e9dd 55%,#93baba)}.gesture{width:56px;height:3px;background:#3c4252;border-radius:3px;margin:0 auto}.caption{padding:9px 12px 0;color:#626b7a;font-size:12px}.device footer{display:flex;justify-content:space-between;padding:6px 8px;height:44px;align-items:center}.device footer .keys{display:flex;gap:2px}.device footer button{height:28px;padding:0 7px}.device footer .targetlabel{color:#5265d8;font-size:12px}.hint{margin-top:18px;color:#626b7a;font-size:12px}.hint button{font-size:12px;color:#4455bd}.inspector{width:320px;border-left:1px solid #d8dde5;background:#f7f8fa;padding:16px;display:none}.inspector.open{display:block}.inspector .heading{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:20px}.targetbox{padding:12px;background:#e9edff;border-radius:5px;margin-bottom:22px;color:#4455bd}.targetbox small{display:block;margin-top:6px;font-size:12px}.formlabel{display:block;margin-bottom:8px;color:#626b7a;font-size:12px}.inspector textarea{width:100%;height:84px;resize:vertical;border:1px solid #d8dde5;border-radius:5px;background:#fff;padding:10px;font:inherit}.inspector label.check{display:block;margin:18px 0;color:#626b7a}.inspector .help{font-size:12px;color:#626b7a;line-height:1.7;margin-bottom:22px}.inspector .primary{width:100%;height:32px}.statusbar{height:28px;border-top:1px solid #d8dde5;background:#f7f8fa;display:flex;align-items:center;padding:0 16px;color:#626b7a;font-size:12px;gap:16px}.statusbar .spacer{flex:1}.statusbar button{height:24px;font-size:12px}.log{display:none;background:#fff;border-top:1px solid #d8dde5}.log.open{display:block}.loghead{display:flex;align-items:center;gap:8px;background:#f7f8fa;padding:6px 16px}.loghead span{flex:1}.loghead button{font-size:12px;height:26px}.log pre{margin:0;padding:12px 16px;height:180px;overflow:auto;font:12px/1.8 ui-monospace,Menlo,monospace;color:#626b7a;white-space:pre-wrap;user-select:text}.library{display:none}.library table{border-collapse:collapse;width:100%;text-align:left;background:#fff;border:1px solid #d8dde5}.library th{color:#626b7a;background:#f7f8fa;font-size:12px;font-weight:500;height:36px}.library td{height:60px;border-top:1px solid #e6e9ee}.library td,.library th{padding:0 14px}.library td:first-child{width:36px}.library small{display:block;color:#626b7a;font-size:12px;margin-top:5px}.library .rowactions{width:130px;text-align:right}.library .rowactions button{height:28px}.focused .grid{grid-template-columns:252px 252px}.focused .screen{height:520px}.focused .device{width:252px}.notice{position:sticky;bottom:0;background:#252a34;color:#fff;padding:9px 16px;display:none}.notice.visible{display:block}.window.compact .grid{grid-template-columns:repeat(auto-fill,220px)}.window.compact .device{width:220px}.window.compact .screen{height:352px}.window.large .grid{grid-template-columns:repeat(auto-fill,300px)}.window.large .device{width:300px}.window.large .screen{height:544px}.gone{display:none!important}.toolmenu{position:absolute;right:150px;top:45px;width:240px;background:#fff;border:1px solid #d8dde5;border-radius:6px;padding:6px;box-shadow:0 6px 18px #252a3415;z-index:5;display:none}.toolmenu.open{display:block}.toolmenu small{display:block;color:#626b7a;padding:6px 8px 10px}.toolmenu button{display:block;width:100%;text-align:left;border:0;background:transparent}.toolmenu hr{border:0;border-top:1px solid #d8dde5}.toolmenu .danger{color:#c54545}@media(max-width:950px){.toolbar [data-demo]{display:none}.toolbar #batch{display:none}.search input{width:130px}.inspector{width:280px}.toolbar .search{margin-left:0}.review{flex-wrap:wrap}}@media(max-width:620px){.inspector.open{width:100%;border-left:0;border-top:1px solid #d8dde5}.content{flex-direction:column}.review span{display:none}.toolbar{gap:4px}.toolbar .divider{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,252px))}.library{overflow:auto}.library table{min-width:660px}.statusbar .targetstate{display:none}.viewline{flex-wrap:wrap}}
</style>
<div class="review"><strong>设计方案 · 交互原型</strong><span>示例画面，操作不会控制真实设备</span><div class="spacer"></div><label>窗口 <select id="window-size"><option value="normal">常规</option><option value="max">最大化</option></select></label><label>在线 <select id="device-count"><option value="2">2 台</option><option value="6">6 台（布局演示）</option></select></label></div>
<div id="app" class="window normal">
<div class="titlebar"><i class="dot"></i><i class="dot yellow"></i><i class="dot green"></i><span>安卓设备矩阵</span></div>
<div class="toolbar"><div class="nav"><button id="wall-tab" class="plain active">设备墙</button><button id="library-tab" class="plain">设备库 · 10</button></div><button class="plain" data-demo="重新扫描设备">↻ 扫描</button><button class="plain" data-demo="打开创建模拟器向导">＋ 新建</button><div class="search">⌕ <input id="search" aria-label="搜索设备" placeholder="搜索设备"></div><div class="divider"></div><button id="tools">设备操作 ▾</button><button id="batch" disabled>批量操作</button><button id="logs" class="plain">日志</button><div id="toolmenu" class="toolmenu"><small>主目标：Pixel_10_Pro</small><button id="install-menu">安装应用…</button><button data-demo="打开卸载应用任务，并显示主目标">卸载应用…</button><button data-demo="打开输入文本任务，并显示主目标">输入文本…</button><hr><button data-demo="重启前显示目标与确认">重启…</button><button class="danger" data-demo="关闭前显示目标与确认">关闭…</button></div></div>
<div class="content"><main class="workspace">
<section id="wall"><div class="viewline"><strong id="online-count">在线设备 · 2</strong><span>截图预览</span><div class="spacer"></div><label>画面 <select id="density"><option value="standard">标准</option><option value="compact">紧凑</option><option value="large">放大</option></select></label></div><div id="grid" class="grid"></div><div class="hint">另有 8 台未启动模拟器 <button id="show-library" class="plain">查看设备库 →</button></div></section>
<section id="library" class="library"><div class="viewline"><strong>设备库</strong><span>2 台在线 · 8 台未启动</span><div class="spacer"></div><select aria-label="设备状态筛选" id="library-filter"><option>全部设备</option><option>在线</option><option>未启动</option></select></div><table><thead><tr><th></th><th>设备</th><th>类型</th><th>状态</th><th class="rowactions">操作</th></tr></thead><tbody id="library-body"></tbody></table></section>
</main><aside id="inspector" class="inspector"><div class="heading">安装应用<button id="close-tool" class="plain" aria-label="关闭安装面板">×</button></div><div class="targetbox">主目标：Pixel_10_Pro<small>emulator-5554 · 在线</small></div><label class="formlabel" for="apk">APK 文件或下载地址</label><textarea id="apk" placeholder="拖入 APK 或粘贴 HTTPS 地址"></textarea><button data-demo="打开 APK 文件选择器" style="margin-top:10px">选择文件</button><label class="check"><input type="checkbox"> 允许降级安装</label><p class="help">安装到上方显示的主目标。批量安装从「批量操作」进入，并在提交前列出目标设备。</p><button class="primary" data-demo="此处为设计原型，不执行真实安装">安装到 Pixel_10_Pro</button></aside></div>
<section id="log" class="log"><div class="loghead"><span>日志 · 2 条</span><button id="follow" class="plain">跟随最新</button><button id="copylog" class="plain">复制</button><button id="clearlog" class="plain">清空</button><button id="closelog" class="plain">收起</button></div><pre id="logtext" tabindex="0">11:55:28  INFO  开始：扫描设备
11:55:30  DONE  完成：2 台在线，8 台未启动</pre></section>
<div class="statusbar"><span class="status">● 工具已就绪</span><span>扫描完成</span><div class="spacer"></div><span class="targetstate">主目标：Pixel_10_Pro</span><span id="selection">未勾选</span></div><div id="notice" class="notice" role="status"></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),app=$('app');let current='wall',count=2;const selectedKeys=new Set();const names=['Pixel_10_Pro','SM_S931Q','Pixel_8','Pixel_9','Galaxy_S24','Pixel_Tablet'];
const phone=(i)=>`<div class="phone ${i%2?'samsung':''}"><div class="phonebar"><span>11:55</span><span>••• ▰</span></div><div class="clock">11:55</div><div class="date">10月7日 星期三</div><div class="apps">${['电话','信息','相机','浏览器','照片','设置'].map((n,j)=>`<div><i>${['☎','✉','◉','◈','▦','⚙'][j]}</i>${n}</div>`).join('')}</div><div class="gesture"></div></div>`;
const note=text=>{$('notice').textContent=text;$('notice').classList.add('visible');setTimeout(()=>$('notice').classList.remove('visible'),2600)};
function draw(){const search=$('search').value.toLowerCase();$('grid').innerHTML=names.slice(0,count).map((name,i)=>({name,i})).filter(d=>d.name.toLowerCase().includes(search)).map(({name,i})=>`<article class="device ${i===0?'target':''} ${selectedKeys.has(name)?'chosen':''}"><header><input type="checkbox" aria-label="勾选 ${name}" class="devicecheck" data-key="${name}" ${selectedKeys.has(name)?'checked':''}><strong>${name}</strong><button class="plain more" aria-label="${name} 更多操作">···</button></header><div class="meta"><span class="status">● 在线</span><span>${i===0?'模拟器':'USB 设备'}</span></div><div class="screen" aria-label="Android 示例桌面">${phone(i)}</div><div class="caption">截图 11:55:30${i===0?' · <span class="targettag">主目标</span>':''}</div><footer><div class="keys"><button class="plain" data-demo="返回操作">‹ 返回</button><button class="plain" data-demo="主页操作">⌂ 主页</button></div><button class="plain" data-demo="打开独立镜像窗口">窗口 ↗</button></footer></article>`).join('');$('online-count').textContent='在线设备 · '+count;if($('logtext').textContent)$('logtext').textContent='11:55:28  INFO  开始：扫描设备\n11:55:30  DONE  完成：'+count+' 台在线，8 台未启动';if(!$('grid').children.length)$('grid').innerHTML='<div class="empty">未找到匹配设备。请清空或修改搜索条件。</div>';bind();selectCount()}
function bind(){document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>note(b.dataset.demo));document.querySelectorAll('.devicecheck,.libcheck').forEach(b=>b.onchange=()=>{b.checked?selectedKeys.add(b.dataset.key):selectedKeys.delete(b.dataset.key);document.querySelectorAll('.devicecheck,.libcheck').forEach(c=>{c.checked=selectedKeys.has(c.dataset.key);if(c.closest('.device'))c.closest('.device').classList.toggle('chosen',c.checked)});selectCount()});document.querySelectorAll('.more').forEach(b=>b.onclick=()=>note('更多：设为主目标、设备详情、重启、关闭。危险操作需单独确认。'))}
function selectCount(){const n=selectedKeys.size;$('selection').textContent=n?'已勾选 '+n+' 台':'未勾选';$('batch').disabled=!n;$('batch').textContent=n?'批量操作 · '+n:'批量操作'}
function view(v){current=v;$('wall').style.display=v==='wall'?'block':'none';$('library').style.display=v==='library'?'block':'none';$('wall-tab').classList.toggle('active',v==='wall');$('library-tab').classList.toggle('active',v==='library');$('inspector').classList.remove('open');drawLibrary()}
function drawLibrary(){$('library-tab').textContent='设备库 · '+(count+8);$('library').querySelector('.viewline span').textContent=count+' 台在线 · 8 台未启动';const filter=$('library-filter').value,search=$('search').value.toLowerCase();$('library-body').innerHTML=[...names.slice(0,count),...Array.from({length:8},(_,i)=>'example_'+(5050+i))].map((n,i)=>({n,i})).filter(({n,i})=>n.toLowerCase().includes(search)&&(filter==='全部设备'||(filter==='在线'?i<count:i>=count))).map(({n,i})=>`<tr><td><input class="libcheck" type="checkbox" aria-label="勾选 ${n}" data-key="${n}" ${selectedKeys.has(n)?'checked':''}></td><td>${n}<small>${i<count?(i===0?'emulator-5554':'USB · SM_S931Q'):'Android 16 · arm64'}</small></td><td>${i===1?'真机':'模拟器'}</td><td class="${i<count?'status':''}">${i<count?'在线':'未启动'}</td><td class="rowactions"><button class="plain" data-demo="${i<count?'打开镜像窗口':'启动模拟器'}">${i<count?'窗口 ↗':'▷ 启动'}</button><button class="plain more" aria-label="${n} 更多操作">···</button></td></tr>`).join('');bind();selectCount()}
$('wall-tab').onclick=()=>view('wall');$('library-tab').onclick=$('show-library').onclick=()=>view('library');$('search').oninput=()=>{draw();drawLibrary()};$('library-filter').onchange=drawLibrary;$('density').onchange=()=>{app.classList.remove('compact','large');if($('density').value!=='standard')app.classList.add($('density').value)};$('window-size').onchange=()=>app.classList.toggle('normal',$('window-size').value==='normal');$('device-count').onchange=()=>{count=+$('device-count').value;for(const key of selectedKeys){if(names.includes(key)&&names.indexOf(key)>=count)selectedKeys.delete(key)}draw();drawLibrary()};$('tools').onclick=()=>$('toolmenu').classList.toggle('open');$('install-menu').onclick=()=>{$('toolmenu').classList.remove('open');$('inspector').classList.add('open')};$('close-tool').onclick=()=>$('inspector').classList.remove('open');$('logs').onclick=()=>$('log').classList.toggle('open');$('closelog').onclick=()=>$('log').classList.remove('open');$('follow').onclick=()=>note('跟随最新；选中日志时暂停显示更新');$('clearlog').onclick=()=>$('logtext').textContent='';$('copylog').onclick=async()=>{const text=window.getSelection().toString()||$('logtext').textContent;try{await navigator.clipboard.writeText(text);note('日志已复制')}catch{note('可拖选日志后按 ⌘C 复制')}};$('batch').onclick=()=>note('批量菜单：安装应用、打开外部窗、启动、关闭；先显示目标范围，再提交。');draw();drawLibrary();})();
</script>
</html>
